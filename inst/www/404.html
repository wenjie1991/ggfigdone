<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #fafafa;
      color: #333;
    }

    h1 {
      font-size: 6rem;
      margin-bottom: 1rem;
      color: #e74c3c;
    }

    p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background: #e74c3c;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    a:hover {
      background: #c0392b;
    }

    em {
      font-style: normal;
      color: #e74c3c;
    }
  </style>
</head>
<body>
  <h1>Address Error</h1>
  <p>Oops! The page you’re looking for is not here.</p>
        <p>The address is incorrect. Please double check.</p>
  <!--<a href="/">Go Back Home</a>-->
</body>
</html>
